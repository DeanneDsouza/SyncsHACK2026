<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<link href="theme.css" rel="stylesheet" type="text/css">
</head>
<body class="login-page">

  <a href="welcome.html" class="site-logo">Your Logo</a>
  <p class="login-tagline">Before We Forget</p>

  <div class="login-card">
    <form action="/login" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="button" class="btn" onclick="window.location.href='homepage.html'">Log in</button>
    </form>
    <p class="login-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

</body>
</html>
