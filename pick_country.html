<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Art Form of the Day</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
  }

  /* Top Bar */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #333;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 1000;
  }

  .topbar button {
    background: #555;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 16px;
  }

  .top-title {
    margin-left: 20px;
    font-size: 22px;
    font-weight: bold;
  }


  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 60px; /* below top bar */
    left: 0;
    width: 200px;
    height: calc(100vh - 60px);
    background: #222;
    color: white;
    padding: 20px;
  }

  .sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 15px 0;
    font-size: 18px;
  }

  .sidebar a:hover {
    color: #ddd;
  }

  /* Main Content */
  .content {
    margin-left: 220px;
    margin-top: 80px;
    padding: 20px;
  }

  .section {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 8px;
  }

  .flags {
    display: flex;
    gap: 40px; /* space between images */
    align-items: center;
    }

  .flags a {
    text-align: center;
    text-decoration: none;
    color: black;
  }

  h1 {
    font-size: 36px;
  }

  h2 {
    font-size: 28px;
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <button onclick="window.location.href='home_page.html'">Home</button>
  <span class="top-title">Before We Forget</span>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <h3>Explore</h3>
  <a href="Craft_page.html">Art</a>
  <a href="Literature_page.html">Literature</a>
  <a href="Events_page.html">Events</a>
</div>

<!-- Main Content -->
<div class="content">
    <h1 style = "text-align: center;"> Countries</h1>

    <div class="section flags">
        <h2>Pick a new country to look at</h2>
        <a href = "pick_country.html"
        target = "_blank" rel = "external nofollow">
            <img src="Australia_flag.png" alt="Australia"

            width = "70" height="48" /><br />
            Australia
        </a>

        <a href = "pick_country.html"
        target = "_blank" rel = "external nofollow">
            <img src="China_flag.png" alt="China"

            width = "70" height="48" /><br />
            China
        </a>

        <a href = "pick_country.html"
        target = "_blank" rel = "external nofollow">
            <img src="India_flag.png" alt="India"

            width = "70" height="48" /><br />
            India
        </a> 
    </div>

</div>

</body>
</html>
