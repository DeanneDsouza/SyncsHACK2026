<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <div class="login-logo">Your Logo</div>
  <p class="login-tagline">Create your account</p>

  <div class="login-card">
    <form action="signup" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn">Sign up</button>
    </form>
    <p class="login-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>

</body>
</html>
